<text x="18" y="545" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Benefits</text>
<rect x="18" y="574" width="294" height="96" rx="13" fill="#fff"/><rect x="36" y="596" width="38" height="38" rx="10" fill="#f3d9a4"/><text x="50" y="620" font-family="Arial" font-size="15" font-weight="700" fill="#12403d">✓</text><text x="90" y="600" font-family="Arial" font-size="13" font-weight="700" fill="#0f172a">Clear trip status</text><text x="90" y="625" font-family="Arial" font-size="10" fill="#5f6875">Know the current stage without calling.</text>
