<rect x="18" y="90" width="250" height="42" rx="5" fill="#999"/><rect x="18" y="150" width="292" height="48" rx="5" fill="#ddd"/><rect x="18" y="218" width="145" height="38" rx="6" fill="#aaa"/>
<rect x="18" y="292" width="294" height="155" rx="10" fill="#ddd"/>
