</g>
<g transform="translate(500,120)">
<text x="0" y="-14" font-family="Arial" font-size="14" fill="#666">Mock-up</text>
<rect width="330" height="720" rx="20" fill="#fbfaf6" stroke="#e1e4e6" stroke-width="2"/>
<rect width="330" height="58" fill="#fff"/><rect x="16" y="12" width="34" height="34" rx="10" fill="#3ea98a"/><text x="28" y="35" font-family="Arial" font-size="17" font-weight="700" fill="#fff">R</text><text x="60" y="34" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a">Rumbo</text><text x="286" y="34" font-family="Arial" font-size="19" fill="#0f172a">☰</text>
<text x="18" y="98" font-family="Arial" font-size="10" font-weight="700" fill="#12403d">SCHOOL TRANSPORT COORDINATION</text>
<text x="18" y="138" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Confidence in every</text><text x="18" y="173" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">school trip.</text>
<text x="18" y="210" font-family="Arial" font-size="12" fill="#5f6875">Clear trip status, milestones and relevant</text><text x="18" y="229" font-family="Arial" font-size="12" fill="#5f6875">alerts for families and drivers.</text>
<rect x="18" y="260" width="155" height="38" rx="7" fill="#3ea98a"/><text x="34" y="284" font-family="Arial" font-size="11" font-weight="700" fill="#fff">Discover the benefits</text>
